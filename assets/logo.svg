    <rect x="30" y="46" width="20" height="6" rx="3"/>
    <rect x="82" y="40" width="30" height="6" rx="3"/>
    <rect x="82" y="52" width="18" height="6" rx="3"/>
    <rect x="32" y="84" width="30" height="6" rx="3"/>
    <rect x="32" y="96" width="22" height="6" rx="3"/>
    <rect x="80" y="90" width="30" height="6" rx="3"/>
    <rect x="80" y="102" width="20" height="6" rx="3"/>
  </g>
</svg>
